name: Assess OPeRA 2025 shopping interaction source

on:
  push:
    branches: [main]
    paths:
      - "retailrocket-recommender/scripts/inspect_opera_2025.py"
      - ".github/workflows/assess-opera-2025.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opera-2025-assessment
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader
        run: pip install pyarrow
      - name: Download and inspect actual shopping action records
        run: python retailrocket-recommender/scripts/inspect_opera_2025.py
      - name: Commit source assessment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retailrocket-recommender/reports/opera_2025_assessment.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified OPeRA 2025 action data assessment"
            git pull --rebase origin main
            git push
          fi
