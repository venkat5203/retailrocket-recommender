name: Refresh current product catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r retailrocket-recommender/requirements.txt
      - name: Fetch 2026 catalogue and build recommendations
        working-directory: retailrocket-recommender
        run: python scripts/build_current_recommender.py
      - name: Commit refreshed dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retailrocket-recommender/data.js retailrocket-recommender/web/data.js retailrocket-recommender/reports/current_catalogue_summary.json
          git diff --cached --quiet || (git commit -m "Refresh current Open Food Facts recommendation catalogue" && git push)
