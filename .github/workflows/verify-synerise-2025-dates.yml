name: Verify Synerise 2025 event dates

on:
  push:
    branches: [main]
    paths:
      - "retailrocket-recommender/scripts/inspect_synerise_2025_dates.py"
      - ".github/workflows/verify-synerise-2025-dates.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synerise-date-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader
        run: pip install pyarrow
      - name: Download and inspect event timestamps
        run: python retailrocket-recommender/scripts/inspect_synerise_2025_dates.py
      - name: Commit verified date range
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retailrocket-recommender/reports/synerise_2025_date_assessment.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified RecSys 2025 event date range"
            git pull --rebase origin main
            git push
          fi
